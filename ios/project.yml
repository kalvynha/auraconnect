# XcodeGen spec for the AuraConnect iOS app.
#   brew install xcodegen && xcodegen generate
# The generated AuraConnect.xcodeproj is not committed.
name: AuraConnect

options:
  bundleIdPrefix: com.auraconnect
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your team here or in Xcode's Signing & Capabilities tab.
    DEVELOPMENT_TEAM: ""

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:
  AuraConnect:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AuraConnect
        excludes:
          - Info.plist
    entitlements:
      # Existing, hand-maintained file (kept so its comments survive `xcodegen generate`).
      path: AuraConnect/Resources/AuraConnect.entitlements
    info:
      # Generated by XcodeGen from the properties below; do not edit by hand.
      path: AuraConnect/Info.plist
      properties:
        CFBundleDisplayName: AuraConnect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: AuraConnect uses the camera to scan referral documents and to attach photos to secure messages.
        NSFaceIDUsageDescription: AuraConnect uses Face ID to keep patient information locked when you are away from the app.
        NSPhotoLibraryUsageDescription: AuraConnect lets you attach photos from your library to secure messages.
        UIBackgroundModes:
          - remote-notification
        # Push handling is wired manually in AppDelegate (no method swizzling).
        FirebaseAppDelegateProxyEnabled: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auraconnect.app
        PRODUCT_NAME: AuraConnect
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: $(inherited) -ObjC
    dependencies:
      # No FirebaseAnalytics / Crashlytics: they are not covered by a BAA and are
      # intentionally excluded for HIPAA reasons.
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging

  AuraConnectTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AuraConnectTests
    dependencies:
      - target: AuraConnect
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.auraconnect.app.tests

schemes:
  AuraConnect:
    build:
      targets:
        AuraConnect: all
        AuraConnectTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AuraConnectTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  AuraConnect-Emulators:
    build:
      targets:
        AuraConnect: all
    run:
      config: Debug
      environmentVariables:
        USE_FIREBASE_EMULATORS: "1"
